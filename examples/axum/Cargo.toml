[package]
name = "api-catalog-example-axum"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
api-catalog = { path = "../../packages/rust", features = ["axum"] }
axum        = "0.7"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
