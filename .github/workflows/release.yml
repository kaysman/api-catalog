name: Release

on:
  push:
    tags: ["v*"]

# npm and crates.io publish in separate jobs, so one registry never blocks the
# other. npm is required; crates.io is skipped (with a warning) until the
# CARGO_REGISTRY_TOKEN secret exists — add it later and re-run that job:
#   gh run rerun <run-id> --job <crates job id>
# Each publish skips a version that's already live, so re-runs are safe.

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag matches package version
        run: |
          version=$(node -p "require('./packages/node/package.json').version")
          echo "tag=${GITHUB_REF_NAME#v} npm=$version"
          test "${GITHUB_REF_NAME#v}" = "$version"

      - run: npm ci

      - name: Publish to npm
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::Missing secret NPM_TOKEN"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          if npm view "api-catalog@$version" version >/dev/null 2>&1; then
            echo "api-catalog@$version is already on npm — skipping"
          else
            npm publish -w api-catalog --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crates:
    needs: ci
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "api-catalog") | .version')
          echo "tag=${GITHUB_REF_NAME#v} crate=$version"
          test "${GITHUB_REF_NAME#v}" = "$version"

      - name: Skip — no crates.io token
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::warning::CARGO_REGISTRY_TOKEN is not set — crates.io publish skipped. Add the secret and re-run this job."

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -sf -A "api-catalog-release (github.com/kaysman/api-catalog)" \
              "https://crates.io/api/v1/crates/api-catalog/$version" >/dev/null; then
            echo "api-catalog $version is already on crates.io — skipping"
          else
            cargo publish -p api-catalog
          fi

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        run: |
          # Notes = this version's section of CHANGELOG.md
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
