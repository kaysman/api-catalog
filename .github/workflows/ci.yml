name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: UI wrappers are in sync with ui/
        run: npm run check:ui
      - run: npm run lint
      - run: npm run build
      - name: Types resolve for consumers (node10, node16, nodenext, bundler)
        run: npm run check:types -w api-catalog
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run -w api-catalog

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Test without optional features
        run: cargo test -p api-catalog
      - name: Crate packages and builds standalone
        run: cargo publish -p api-catalog --dry-run
